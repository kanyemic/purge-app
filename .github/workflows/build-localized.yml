name: Build 汉化版

# 中文汉化分支的构建工作流。
#
# 与上游 build.yml 的区别：
#   - 只做“能编译”的验证，不发布、不创建 Release、不推送任何 Appcast。
#   - 额外把编译出来的 Purge.app 打包成 artifact，方便直接下载试用。
#   - ad-hoc 签名，不需要 Apple 开发者账号或任何仓库密钥。
#
# 注意：使用本工作流意味着把代码推到 GitHub 并消耗该仓库的 Actions 额度。
# 若只想本地使用，直接用 scripts/build-localized.sh 即可，无需本文件。

on:
  workflow_dispatch:        # 只在手动点击时触发，避免每次 push 都跑
  push:
    branches: [localized]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 设计 token 检查
        run: node scripts/lint-design-tokens.mjs

      - name: 解析 Swift Package 依赖
        run: |
          xcodebuild -resolvePackageDependencies \
            -project purge.xcodeproj \
            -scheme purge

      - name: 编译（ad-hoc 签名）
        run: |
          xcodebuild clean build \
            -project purge.xcodeproj \
            -scheme purge \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO

      - name: 框架重签与库验证放行
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Purge.app"
          test -d "$APP" || { echo "没有找到 Purge.app"; exit 1; }
          # 在 ad-hoc 签名且无开发者账号时，Sparkle.framework 与主程序缺乏匹配的 Team ID，
          # dyld 默认开启的 Library Validation 会抛出 EXC_CRASH 阻止启动。
          # 先对 Frameworks 做 deep 签名，再为主程序赋予 disable-library-validation 授权。
          if [ -d "$APP/Contents/Frameworks" ]; then
            find "$APP/Contents/Frameworks" -type d -name "*.framework" -exec codesign --force --deep -s - {} +
          fi
          codesign --force -s - --entitlements scripts/adhoc.entitlements "$APP"

      - name: 校验汉化与更新隔离
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Purge.app"
          test -d "$APP" || { echo "没有找到 Purge.app"; exit 1; }

          # 用 plutil 而不是 defaults read：defaults 不接受相对路径，
          # 相对路径下会报 "domain/default pair does not exist"，读不到键值。
          INFO="$APP/Contents/Info.plist"
          AUTO_CHECK="$(plutil -extract SUEnableAutomaticChecks raw -o - "$INFO")"
          FEED_URL="$(plutil -extract SUFeedURL raw -o - "$INFO" || echo '')"
          INTERVAL="$(plutil -extract SUScheduledCheckInterval raw -o - "$INFO" || echo 'absent')"
          echo "自动更新开关：$AUTO_CHECK"
          echo "更新源：'$FEED_URL'"
          echo "检查间隔：$INTERVAL"

          # 更新必须处于关闭状态，否则中文版会被上游英文版覆盖。
          test "$AUTO_CHECK" = "false" || { echo "自动更新没有被关闭"; exit 1; }
          test -z "$FEED_URL" || { echo "更新源没有被清空"; exit 1; }

          # 汉化必须真的落进产物。
          test -f "$APP/Contents/Resources/explanations.json" \
            || { echo "explanations.json 没有打进 App bundle"; exit 1; }
          grep -q "可以安全" "$APP/Contents/Resources/explanations.json" \
            || { echo "explanations.json 里没有中文文案"; exit 1; }

          # 二进制里查中文界面文案。注意：Swift 会把 ≤ 15 字节的字符串
          # 内联进指令流做小字符串优化，不会以连续 UTF-8 落在常量区，
          # 所以这里用长文案（均 > 15 字节），命中任一即可。
          # 可执行文件名由 CFBundleExecutable 决定，不要硬编码。
          EXEC_NAME="$(plutil -extract CFBundleExecutable raw -o - "$INFO" 2>/dev/null || true)"
          [ -n "$EXEC_NAME" ] || EXEC_NAME="Purge"
          EXEC="$APP/Contents/MacOS/$EXEC_NAME"
          test -f "$EXEC" || { echo "找不到可执行文件：$EXEC"; exit 1; }

          FOUND=0
          PROBES=(
            "在这段时间内没有动过的项目会出现在开发者项目中供清理"
            "清空废纸篓即可释放这部分空间"
            "扫描会跳过这些文件和文件夹及其中的所有内容"
          )
          for probe in "${PROBES[@]}"; do
            if LC_ALL=C grep -aqF "$probe" "$EXEC"; then
              echo "二进制汉化文案命中：$probe"
              FOUND=1
              break
            fi
          done
          test "$FOUND" = "1" \
            || { echo "二进制里没有找到中文界面文案"; exit 1; }
          echo "汉化校验：规则库与二进制均已确认中文文案"

          # 校验 entitlements 确保已放行库验证，避免运行时 dyld 因缺少 Team ID 崩溃
          codesign -d --entitlements :- "$APP" 2>&1 | grep -q "disable-library-validation" \
            || { echo "缺少 disable-library-validation entitlement"; exit 1; }
          echo "签名校验：已确认注入库验证放行授权"

      - name: 打包 Purge.app
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Purge.app"
          # 版本由 GENERATE_INFOPLIST_FILE + MARKETING_VERSION 写进构建产物；
          # 万一该键缺失，回退到工程设置，避免打包步骤因取不到版本而失败。
          VERSION="$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist" 2>/dev/null || true)"
          [ -n "$VERSION" ] || VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \([^;]*\);.*/\1/p' purge.xcodeproj/project.pbxproj | head -1)"
          [ -n "$VERSION" ] || VERSION="unknown"
          echo "版本：$VERSION"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Purge-汉化版-${VERSION}.zip"
          ls -lh dist

      - name: 显示构建环境
        run: sw_vers

      - uses: actions/upload-artifact@v4
        with:
          name: Purge-汉化版
          path: dist/*.zip
          if-no-files-found: error
